name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # Fast feedback: catches syntax errors and bad imports without building images.
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile backend
        run: python -m compileall -q backend/app backend/main.py

  # Boots the full stack and runs the end-to-end smoke test. This is the gate
  # that would have caught every boot/flow regression we've hit: duplicate
  # models (won't boot), missing imports (dead endpoints), the dict-vs-object
  # auth bug, and the broken signing wiring.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          APP_NAME=VistaSign
          VERSION=1.0.0
          DEBUG=false
          ENVIRONMENT=ci
          APP_URL=http://localhost:8000
          FRONTEND_URL=http://localhost:3000
          SINGLE_HOSTNAME=localhost
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/vistasign
          POSTGRES_DB=vistasign
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          SECRET_KEY=ci-secret-key-not-for-production-0123456789abcdef
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=0.33
          INVITE_ONLY=true
          COOKIE_DOMAIN=
          COOKIE_SECURE=false
          ALLOWED_ORIGINS=http://localhost:3000,http://localhost
          UPLOAD_DIR=uploads
          MAX_FILE_SIZE=104857600
          ENCRYPTION_KEY=ZmRldi1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzLWxvbmcxMjM0NQ==
          REDIS_URL=redis://redis:6379/0
          LOG_LEVEL=INFO
          LOG_FILE=logs/vistasign.log
          INITIAL_ADMIN_EMAIL=admin@example.com
          INITIAL_ADMIN_PASSWORD=Admin123!changeme
          INITIAL_ADMIN_FIRST_NAME=Admin
          INITIAL_ADMIN_LAST_NAME=User
          EOF

      - name: Build and start stack
        run: docker compose up -d --build db redis backend worker

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T backend python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)" 2>/dev/null; then
              echo "backend healthy after ${i} tries"; exit 0
            fi
            sleep 5
          done
          echo "::error::backend did not become healthy"; exit 1

      - name: Run smoke test
        run: docker compose exec -T backend python scripts/smoke_test.py

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend worker db redis

      - name: Tear down
        if: always()
        run: docker compose down -v
