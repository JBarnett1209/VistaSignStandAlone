
services:
  # Nginx Reverse Proxy (serves frontend build and proxies API)
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
      args:
        - REACT_APP_API_URL=https://${SINGLE_HOSTNAME}
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/app/frontend
      - node_modules:/app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - web

  # Certbot for Let's Encrypt
  certbot:
    image: certbot/dns-route53
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    command: certonly --dns-route53 -d ${SINGLE_HOSTNAME} --email ${ACME_EMAIL} --agree-tos --non-interactive --expand
    networks:
      - web


  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vistasign}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web

  # VistaSign Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Do not expose directly; Traefik will route HTTPS to it
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    # No labels needed for Nginx
    networks:
      - web

  # Frontend dev server removed in production

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  letsencrypt_certs:
  letsencrypt_www:
  node_modules:

networks:
  web:
    driver: bridge
