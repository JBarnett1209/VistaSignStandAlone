
services:
  # Nginx Reverse Proxy (serves frontend build and proxies API)
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
      args:
        - REACT_APP_API_URL=https://${SINGLE_HOSTNAME}
    environment:
      - REACT_APP_API_URL=https://${SINGLE_HOSTNAME}
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - web

  # Certbot for Let's Encrypt (disabled; ALB terminates TLS). Re-enable if terminating TLS here.
  # certbot:
  #   image: certbot/dns-route53
  #   volumes:
  #     - letsencrypt_certs:/etc/letsencrypt
  #     - letsencrypt_www:/var/www/certbot
  #   environment:
  #     - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
  #     - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
  #     - AWS_REGION=${AWS_REGION}
  #   command: certonly --dns-route53 -d ${SINGLE_HOSTNAME} --email ${ACME_EMAIL} --agree-tos --non-interactive --expand
  #   networks:
  #     - web


  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vistasign}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bound to localhost only — never expose the database to the LAN/internet.
    # Containers reach it over the internal 'web' network as host 'db'.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web

  # Redis Cache
  redis:
    image: redis:7-alpine
    # Bound to localhost only — reached internally as host 'redis'.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - web

  # VistaSign Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Do not expose directly; Traefik will route HTTPS to it
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    # No --reload in production: the file watcher restarts the app on every code
    # change (and during deploys), which surfaces as intermittent 502s on in-flight
    # requests. Deploys apply code via an explicit `docker compose up -d` restart.
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # No labels needed for Nginx
    networks:
      - web

  # ClamAV Antivirus Scanner - DISABLED (resource intensive)
  # clamav:
  #   image: clamav/clamav:1.0
  #   ports:
  #     - "3310:3310"
  #   volumes:
  #     - clamav_data:/var/lib/clamav
  #   environment:
  #     - CLAMAV_NO_FRESHCLAMD=false
  #   healthcheck:
  #     test: ["CMD", "clamdscan", "--version"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - web

  # LibreOffice for document conversion - DISABLED (resource intensive)
  # libreoffice:
  #   image: lscr.io/linuxserver/libreoffice:latest
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=UTC
  #   volumes:
  #     - ./backend/uploads:/documents
  #     - libreoffice_data:/config
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - web

  # RQ Worker for background tasks (envelope finalization: flatten + sign + evidence).
  # Listens on the 'finalize' queue. Document ingest is done inline at upload, so
  # there is no separate ingest job/queue.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: rq worker finalize default --url redis://redis:6379/0
    networks:
      - web

  # RQ Scheduler for periodic tasks - DISABLED (resource intensive)
  # scheduler:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   env_file:
  #     - .env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app
  #     - uploads_data:/app/uploads
  #   command: python -m rq scheduler --url redis://redis:6379/0
  #   networks:
  #     - web

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  # clamav_data:  # DISABLED
  # libreoffice_data:  # DISABLED

networks:
  web:
    driver: bridge
