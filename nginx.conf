events {
    worker_connections 1024;
}

http {
    # Enable access logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Main application server. Sits behind Cloudflare -> Nginx Proxy Manager,
    # which terminates TLS and forwards plain HTTP here. Marked default_server
    # so it answers regardless of the Host header the upstream proxy sends.
    server {
        listen 80 default_server;
        server_name vs.unitvista.com vistasign.unitvista.com _;
        
        # Force HTTPS semantics in the browser and subdomains
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # Auto-upgrade any inadvertent http:// resources to https://
        add_header Content-Security-Policy "upgrade-insecure-requests" always;

        # Add security headers to prevent redirects
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Health check endpoint - route to backend
        location /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Force HTTPS protocol for ALB setups
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # Backend API routes - use service name directly
        location /api {
            client_max_body_size 100m;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Force HTTPS protocol for ALB setups
            proxy_set_header X-Forwarded-Proto https;
            # Ensure auth header is forwarded for Bearer token auth
            proxy_set_header Authorization $http_authorization;
            # Ensure cookies are properly forwarded
            proxy_pass_header Set-Cookie;
            proxy_cookie_domain ~^(.+)$ vs.unitvista.com;
            proxy_cookie_path / /;
        }
        
        # Backend docs - route to backend
        location /docs {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Force HTTPS protocol for ALB setups
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # Test endpoints - route to backend
        location /test-email {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Force HTTPS protocol for ALB setups
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # SPA static root
        root /usr/share/nginx/html;
        index index.html;

        # Cache static assets conservatively to allow restart-based updates without hard refresh
        location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
            expires 10m;
            add_header Cache-Control "public, max-age=600, must-revalidate";
            try_files $uri =404;
        }

        # Never cache the HTML entrypoint
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        # Ensure PWA control files are not cached aggressively
        location = /manifest.json {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }
        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        # Root landing logic: let frontend handle authentication
        location = / {
            # Serve the SPA and let React Router handle authentication
            try_files $uri $uri/ /index.html;
        }


        # SPA fallback for all other routes
        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
    
    # Secondary server kept for an explicit unmatched-host health probe.
    # The main server above is now default_server, so this rarely matches.
    server {
        listen 80;
        server_name __catchall__;

        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Return 444 (close connection) for other paths to wrong domains
        location / {
            return 444;
        }
    }
}
