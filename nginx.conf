events {
    worker_connections 1024;
}

http {
    # Health check endpoint for ALB (HTTP on port 80)
    server {
        listen 80;
        server_name _;
        
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
    
    # Main application server (ALB sends HTTP here)
    server {
        listen 80;
        server_name vistasign.unitvista.com;
        
        # Health check endpoint - route to backend
        location /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Backend API routes - use service name directly
        location /api {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Backend docs - route to backend
        location /docs {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Serve built frontend statically (SPA)
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Cache static assets aggressively
        location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
    }
}
