events {
    worker_connections 1024;
}

http {
    # Main application server (ALB sends HTTP here)
    server {
        listen 80;
        server_name vistasign.unitvista.com;
        
        # Add security headers to prevent redirects
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Health check endpoint - route to backend
        location /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Backend API routes - use service name directly
        location /api {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Backend docs - route to backend
        location /docs {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # SPA static root
        root /usr/share/nginx/html;
        index index.html;

        # Cache static assets conservatively to allow restart-based updates without hard refresh
        location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
            expires 10m;
            add_header Cache-Control "public, max-age=600, must-revalidate";
            try_files $uri =404;
        }

        # Never cache the HTML entrypoint
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        # Ensure PWA control files are not cached aggressively
        location = /manifest.json {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }
        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        # Single fallback — avoid redirect loop
        location / {
            # Avoid caching for HTML routes resolved via index.html
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
    
    # Catch-all server to handle any other requests (also provide /health)
    server {
        listen 80 default_server;
        server_name __catchall__;

        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Return 444 (close connection) for other paths to wrong domains
        location / {
            return 444;
        }
    }
}
