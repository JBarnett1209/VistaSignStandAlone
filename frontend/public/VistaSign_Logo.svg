<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150">
  <defs>
    <!-- Purple gradient matching UnitVista brand -->
    <linearGradient id="uvGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E3AF2"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Main Text -->
  <text x="10" y="75" font-family="Poppins, Inter, Arial, sans-serif" font-size="60" font-weight="600" fill="url(#uvGradient)">
    VistaSign
  </text>

  <!-- Subtext -->
  <text x="15" y="115" font-family="Inter, Arial, sans-serif" font-size="20" fill="#888">
    powered by UnitVista
  </text>
</svg>
